name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medilens_test
          POSTGRES_USER: medilens
          POSTGRES_PASSWORD: medilens
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U medilens -d medilens_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://medilens:medilens@localhost:5432/medilens_test
      CORS_ORIGINS: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall backend
      - name: Smoke test API startup
        working-directory: backend
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  frontend:
    name: Flutter checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter app
        run: flutter analyze
      - name: Test Flutter app
        run: flutter test
      - name: Build Flutter web
        run: flutter build web --release --dart-define=API_BASE_URL=http://localhost:8000/api

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t medilens-backend:ci backend
      - name: Build frontend image
        run: docker build --build-arg API_BASE_URL=http://localhost:8000/api -t medilens-frontend:ci .
